<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of the Opportunity rover on the surface of Mars">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0d12"/><stop offset="0.65" stop-color="#6b2a18"/><stop offset="1" stop-color="#c4562c"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3a1f"/><stop offset="1" stop-color="#3b140a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7c77f"/><stop offset="1" stop-color="#a47c33"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7"><circle cx="90" cy="70" r="1.6"/><circle cx="240" cy="40" r="1.2"/><circle cx="520" cy="90" r="1.6"/><circle cx="690" cy="50" r="1.2"/><circle cx="420" cy="30" r="1"/><circle cx="740" cy="140" r="1.4"/></g>
  <path d="M0 400 Q200 360 400 395 T800 380 L800 600 L0 600Z" fill="url(#ground)"/>
  <ellipse cx="400" cy="490" rx="250" ry="22" fill="#000" opacity="0.35"/>
  <!-- wheels -->
  <g fill="#222126" stroke="#0e0d10" stroke-width="3">
    <circle cx="260" cy="468" r="30"/><circle cx="350" cy="474" r="30"/><circle cx="440" cy="474" r="30"/><circle cx="540" cy="468" r="30"/>
  </g>
  <g fill="#55525c"><circle cx="260" cy="468" r="10"/><circle cx="350" cy="474" r="10"/><circle cx="440" cy="474" r="10"/><circle cx="540" cy="468" r="10"/></g>
  <!-- body -->
  <path d="M255 440 L300 380 H500 L545 440Z" fill="url(#gold)" stroke="#6f5320" stroke-width="3"/>
  <rect x="240" y="372" width="320" height="14" rx="3" fill="#1f2a44"/>
  <!-- mast + camera -->
  <rect x="470" y="300" width="9" height="74" fill="#cfcabf"/>
  <rect x="452" y="278" width="46" height="26" rx="4" fill="#2b2b30"/>
  <circle cx="465" cy="291" r="6" fill="#8fc7ff"/><circle cx="485" cy="291" r="6" fill="#8fc7ff"/>
  <!-- arm -->
  <path d="M545 412 L610 430 L640 458" fill="none" stroke="#cfcabf" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
